# Releases from the Actions tab: works out the next version from the
# conventional commits since the last tag, bumps Cargo.toml, writes the
# changelog, commits `release: vX.Y.Z` to main, tags it, and hands the tag to
# publish.yaml to build and publish.
#
# Publish is called rather than left to start on the tag, because a tag pushed
# with GITHUB_TOKEN does not start other workflows.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.7.0. Leave empty to work it out from the commits.
        required: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  cut:
    name: Bump, write the changelog, and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -z "$(git cliff --unreleased --strip all)" ]; then
            echo "::error::Nothing to release since the last tag."
            exit 1
          fi
          if [ -n "$REQUESTED" ]; then
            tag="v${REQUESTED#v}"
          else
            tag="$(git cliff --bumped-version)"
          fi
          if [ -n "$(git tag -l "$tag")" ]; then
            echo "::error::$tag already exists."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      # The first `version =` in Cargo.toml is the package's own.
      - name: Bump the version
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$NUMBER\"/" Cargo.toml
          cargo update --workspace
          git diff --stat

      - name: Write the changelog
        run: git cliff --tag "${{ steps.version.outputs.tag }}" -o CHANGELOG.md

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $TAG"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

  publish:
    name: Publish
    needs: cut
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.cut.outputs.tag }}
    permissions:
      contents: write
