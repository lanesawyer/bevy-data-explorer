[package]
name = "bevy-data-explorer"
version = "0.4.0"
edition = "2024"
authors = ["Lane Sawyer"]
repository = "https://github.com/lanesawyer/bevy-data-explorer"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_winit", "bevy_sprite", "bevy_window", "bevy_core_pipeline", "bevy_render", "bevy_asset", "bevy_log", "bevy_text", "bevy_ui", "bevy_ui_render", "x11", "wayland", "multi_threaded", "default_font", "bevy_picking", "bevy_scene", "bevy_ui_widgets", "ui_picking", "bevy_feathers", "system_clipboard"] }
bevy_feathers = "0.19"
bevy_ui_widgets = "0.19"
clap = { version = "4", features = ["derive"] }
# Already in the tree through `bevy_image`, declared here for the PNG encoder a
# saved frame is written with, and for decoding Deep Zoom tiles, which are JPEG
# or PNG. Bevy's own features only cover loading assets.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ome_zarr_metadata = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The runtime the reads are driven by. Reqwest's futures register with tokio's
# reactor, so something has to be driving one; this is also what makes a read
# abortable, which is the whole point of doing them asynchronously.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
# Half-precision floats, for channel intensities kept on the GPU unmixed.
# Already in the tree through bevy_image.
half = "2"
# Both already in the tree through zarrs: a safe Rust blosc, to decode single
# blocks of a chunk, and futures to fetch those blocks together.
blusc = "0.0.6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `zlib` is not one of zarrs' default codecs, and is what numcodecs names the
# compressor a good share of older Zarr v2 stores were written with. It costs
# nothing: flate2 is already in the build for gzip.
zarrs = { version = "0.23", features = ["zlib", "async"] }
zarrs_codec = "0.2"
zarrs_plugin = "0.4"
# The async side of zarrs needs a store that speaks it, and object_store's HTTP
# and filesystem backends are that. `zarrs_http` is synchronous only, which is
# what the image path used to be built on.
# `http` and `fs` are the backends the viewer opens: a store over HTTP, and a
# directory on disk. The object_store crate comes through here rather than
# directly, so there is one copy of it in the graph.
zarrs_object_store = { version = "0.7", features = ["http", "fs"] }
url = "2.5.8"
# The Deep Zoom descriptor is a few lines of XML. Already in the lockfile
# through the Wayland bindings.
quick-xml = { version = "0.41", features = ["serialize"] }
# Hands the help screen's links to the system browser.
open = "5"
# A bookmark shared as text is its JSON deflated and base64'd onto one line, so
# a chat client cannot rewrap it. Both are already in the tree.
base64 = "0.22"
flate2 = "1"
# The save and open dialogs a bookmark is exported and imported through. The
# xdg portal on Linux, so no GTK is pulled in.
rfd = "0.17"
# Parquet tables, read row by row without Arrow, which a table of strings has
# no use for. The codecs are the ones already in the tree; brotli is not, and
# a file compressed with it says so rather than opening.
parquet = { version = "60", default-features = false, features = ["snap", "zstd", "lz4", "flate2", "flate2-zlib-rs"] }
bytes = "1"
# The random verifier and its SHA-256 for signing in to the BKP Registry.
# Already in the tree as rustls' crypto.
ring = "0.17"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
# A Bevy system's parameters are its queries and resources, so these fire on
# ordinary systems and say nothing about the code.
too_many_arguments = "allow"
type_complexity = "allow"
# Exceptions are `#[expect]` with a reason, so a stale one is reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
manual_midpoint = "warn"
map_unwrap_or = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
