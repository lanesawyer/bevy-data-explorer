[package]
name = "bevy-data-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_winit", "bevy_sprite", "bevy_window", "bevy_core_pipeline", "bevy_render", "bevy_asset", "bevy_log", "bevy_text", "bevy_ui", "bevy_ui_render", "x11", "wayland", "multi_threaded", "default_font", "bevy_picking", "bevy_scene", "bevy_ui_widgets", "ui_picking", "bevy_feathers", "system_clipboard"] }
bevy_feathers = "0.19"
bevy_ui_widgets = "0.19"
clap = { version = "4", features = ["derive"] }
# Already in the tree through `bevy_image`, declared here for the PNG encoder a
# saved frame is written with. Bevy's own feature only covers loading.
image = { version = "0.25", default-features = false, features = ["png"] }
ome_zarr_metadata = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# The runtime the reads are driven by. Reqwest's futures register with tokio's
# reactor, so something has to be driving one; this is also what makes a read
# abortable, which is the whole point of doing them asynchronously.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `zlib` is not one of zarrs' default codecs, and is what numcodecs names the
# compressor a good share of older Zarr v2 stores were written with. It costs
# nothing: flate2 is already in the build for gzip.
zarrs = { version = "0.23", features = ["zlib"] }
zarrs_codec = "0.2"
zarrs_http = "0.3"
zarrs_plugin = "0.4"
