[package]
name = "bevy-data-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_winit", "bevy_sprite", "bevy_window", "bevy_core_pipeline", "bevy_render", "bevy_asset", "bevy_log", "bevy_text", "bevy_ui", "bevy_ui_render", "x11", "wayland", "multi_threaded", "default_font", "bevy_picking"] }
clap = { version = "4", features = ["derive"] }
ome_zarr_metadata = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zarrs = "0.23"
zarrs_codec = "0.2"
zarrs_http = "0.3"
zarrs_plugin = "0.4"
