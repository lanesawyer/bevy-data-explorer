# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# The Release workflow writes the changelog into each release commit
# with `git cliff --tag vX.Y.Z -o CHANGELOG.md`, regenerating the whole file so
# the compare links at the foot stay right. Publish uses the same
# file for each GitHub release's notes.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/lanesawyer/bevy-data-explorer/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/lanesawyer/bevy-data-explorer/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/lanesawyer/bevy-data-explorer/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/lanesawyer/bevy-data-explorer/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^release", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(chore|ci|build)", group = "<!-- 6 -->Maintenance" },
]
